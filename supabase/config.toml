# Supabase CLI config for the LOCAL/CI stack only. Day-to-day local
# development still points .env.local straight at the remote preprod
# project (see .env.example) - this file exists solely so CI can spin up
# an ephemeral local stack to apply migrations and run the pgTAP tests
# under supabase/tests/database/ (`supabase start` + `supabase test db`).
# Postgres major_version is pinned to match preprod (17).

project_id = "la-bonavida-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
